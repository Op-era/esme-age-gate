<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Age Verification</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: #0b0b0d;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 40px 28px;
    border-radius: 16px;
    background: #17171a;
    border: 1px solid #29292e;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    font-size: 0.95rem;
    color: #a3a3ab;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: block;
    padding: 14px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    transition: opacity 0.15s ease;
  }
  a.btn:active {
    opacity: 0.8;
  }
  a.yes {
    background: #f5f5f5;
    color: #0b0b0d;
  }
  a.no {
    background: transparent;
    color: #a3a3ab;
    border: 1px solid #3a3a40;
  }
  footer {
    margin-top: 24px;
    font-size: 0.75rem;
    color: #5c5c63;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Are you 18 years of age or older?</h1>
    <p>This link leads to age-restricted content. Please confirm your age to continue.</p>
    <div class="buttons">
      <a class="btn yes" href="https://onlyfans.com/esmeaura">Yes, I am 18+</a>
      <a class="btn no" href="https://emoji-isle.havencommand.com">No, take me back</a>
    </div>
    <footer>By clicking "Yes," you confirm you are of legal age to view adult content in your jurisdiction.</footer>
  </div>
</body>
</html>
