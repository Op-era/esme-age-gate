app = "esme-age-captcha"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://op-era.github.io"
  YES_URL = "https://onlyfans.com/esmeaura"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  count = 1
